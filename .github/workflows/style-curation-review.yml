name: Style curation review

on:
  push:
    branches: [styles/curation-v2-category-review]
  pull_request:
    paths:
      - 'components/recipes/**'
      - 'packages/shared/src/styles/**'
      - 'lib/recipeContextBuilders/styles.ts'
      - 'scripts/audit-style-curation*'
      - 'docs/styles/curation-v2/**'
      - '.github/workflows/style-curation-review.yml'

permissions:
  contents: read

concurrency:
  group: style-curation-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Collect tracked source snapshot
        run: |
          mkdir -p /tmp/curation-evidence
          git rev-parse HEAD > /tmp/curation-evidence/source-commit.txt
          git archive HEAD components/recipes packages/shared/src/styles lib/recipeContextBuilders scripts package.json bun.lock tsconfig.web.json tsconfig.scripts.json vitest.config.ts README.md CONTEXT.md AGENTS.md > /tmp/curation-evidence/source.tar
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Review category coverage
        run: |
          if test -f scripts/audit-style-curation.ts; then
            bun scripts/audit-style-curation.ts --verify --output=/tmp/curation-evidence/category-audit.json
          else
            echo 'Category audit implementation not yet present on this commit.'
          fi
      - name: Focused regressions
        run: bun run test -- components/recipes/styleLayerComposer.test.ts components/recipes/styleCurationBoundary.test.ts packages/shared/src/styles/legacyStylePrompt.test.ts
      - name: Publish review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: style-curation-evidence-${{ github.sha }}
          path: /tmp/curation-evidence/
          retention-days: 7
