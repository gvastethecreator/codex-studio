name: Apply and validate style curation

on:
  push:
    branches: [styles/curation-v2-category-review]
    paths: ['.github/workflows/style-curation-bootstrap.yml']

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'gvastethecreator/codex-studio' && github.ref == 'refs/heads/styles/curation-v2-category-review'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: styles/curation-v2-category-review
          fetch-depth: 1
      - name: Verify and apply authored patch
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          mkdir -p /tmp/curation-evidence
          git rev-parse HEAD > /tmp/curation-evidence/input-commit.txt
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          parts = sorted(pathlib.Path('.github/curation-transfer').glob('chunk-*.b85'))
          assert [p.name for p in parts] == [f'chunk-{i:02}.b85' for i in range(1, 10)]
          encoded = ''.join(p.read_text().strip() for p in parts)
          assert len(encoded) == 66375, len(encoded)
          patch = lzma.decompress(base64.b85decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == 'cd5994163a7cd0d53344126c36a8292b11f3397e309819ede5860b5f9c8a8a58'
          target = pathlib.Path('/tmp/curation-evidence/authored.patch')
          target.write_bytes(patch)
          allowed = ('components/recipes/', 'packages/shared/src/styles/', 'scripts/', 'docs/styles/curation-v2/')
          exact = {'package.json', 'lib/recipeContextBuilders/styles.ts', '.github/workflows/style-curation-review.yml'}
          for row in subprocess.check_output(['git','apply','--numstat',str(target)],text=True).splitlines():
              name = row.split('\t', 2)[2]
              assert '..' not in pathlib.PurePosixPath(name).parts
              assert name in exact or name.startswith(allowed), name
          subprocess.run(['git','apply','--check',str(target)],check=True)
          subprocess.run(['git','apply',str(target)],check=True)
          fix = pathlib.Path('.github/curation-transfer/fix-validation.py')
          assert hashlib.sha256(fix.read_bytes()).hexdigest() == '9422258466681cff7236d47d86385626ca0cb5387d4f42ece49d6575a195e5ca'
          subprocess.run(['python3', str(fix)], check=True)
          PY
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Generate source-owned projections
        id: generate
        run: |
          set -o pipefail
          bun scripts/generate-style-curation-review-doc.ts 2>&1 | tee /tmp/curation-evidence/docs.log
          bun run styles:runtime 2>&1 | tee /tmp/curation-evidence/runtime-generate.log
          bun run styles:thumbnails 2>&1 | tee /tmp/curation-evidence/thumbnails-generate.log
          python3 - <<'PY'
          import pathlib, subprocess
          tracked = subprocess.check_output(['git','diff','--name-only','-z']).decode().split('\0')
          new = subprocess.check_output(['git','ls-files','--others','--exclude-standard','-z']).decode().split('\0')
          paths = sorted({p for p in tracked+new if p and pathlib.Path(p).is_file() and pathlib.Path(p).suffix in {'.ts','.tsx','.json','.yaml','.md'} and not p.startswith('.github/')})
          for i in range(0, len(paths), 20):
              subprocess.run(['bunx','vp','fmt','--threads','4',*paths[i:i+20]],check=True)
          PY
          git diff --check
      - name: Browser test dependency
        run: bunx playwright install --with-deps chromium
      - name: Run gates and record actual exit codes
        id: gates
        run: |
          set +e
          run_gate() {
            name="$1"; shift
            "$@" > "/tmp/curation-evidence/${name}.log" 2>&1
            result=$?
            printf '%s\t%s\n' "$name" "$result" | tee -a /tmp/curation-evidence/gates.tsv
            tail -n 30 "/tmp/curation-evidence/${name}.log"
          }
          run_gate category-audit bun scripts/audit-style-curation.ts --verify --output=/tmp/curation-evidence/category-audit.json
          run_gate review-doc bun scripts/generate-style-curation-review-doc.ts --check
          run_gate styles-verify bun run styles:verify
          run_gate tests bun run test
          run_gate check bun run check
          run_gate build bun run build
          exit 0
      - name: Publish ordinary source files on feature branch
        if: steps.generate.outcome == 'success'
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          old = json.loads(subprocess.check_output(['git','show','HEAD:package.json']))
          new = json.loads(pathlib.Path('package.json').read_text())
          for key in ('dependencies','devDependencies','packageManager'):
              assert old.get(key) == new.get(key), key
          assert not subprocess.check_output(['git','diff','--','bun.lock'])
          for p in subprocess.check_output(['git','diff','--name-only']).decode().splitlines():
              if p.startswith('components/recipes/styles/manifests/presets/'):
                  assert p.split('/')[5] in {'pack_19','pack_20','pack_21'}, p
          PY
          # This token cannot modify workflows. Publish only ordinary source changes.
          # Workflow updates and cleanup are performed separately through the authorized connector.
          git restore --source=HEAD -- .github/workflows/
          rm -rf .github/curation-transfer
          git add -A
          test -z "$(git diff --cached --name-only -- .github/workflows/)"
          git diff --cached --stat > /tmp/curation-evidence/change-stat.txt
          git diff --cached --binary > /tmp/curation-evidence/published.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(styles): audit every category, isolate prompt metadata, add portable studies'
          git rev-parse HEAD > /tmp/curation-evidence/output-commit.txt
          git archive HEAD components/recipes packages/shared/src/styles lib/recipeContextBuilders lib/recipeContext.test.ts scripts docs/styles/curation-v2 package.json bun.lock > /tmp/curation-evidence/source.tar
          test "$(git ls-remote origin refs/heads/styles/curation-v2-category-review | cut -f1)" = "$EXPECTED_HEAD"
          git push origin HEAD:refs/heads/styles/curation-v2-category-review
      - name: Upload logs, patch and source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: style-curation-validation-${{ github.run_id }}
          path: /tmp/curation-evidence/
          retention-days: 7
      - name: Report failed gates honestly
        if: steps.gates.outcome == 'success'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          rows = [line.split('\t') for line in Path('/tmp/curation-evidence/gates.tsv').read_text().splitlines()]
          failures = [name for name, code in rows if code != '0']
          if failures:
              raise SystemExit('Failed gates: ' + ', '.join(failures))
          PY
